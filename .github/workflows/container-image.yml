name: Container Image
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('Image - PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title)
      || format('Image - {0} ({1})', github.event.head_commit.message, github.ref_name) }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # One run per PR (newer commits cancel older ones); one run per commit on main.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Resolve context once, then build multi-arch natively in parallel.
  prepare:
    name: Resolve Build Context
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      source_sha: ${{ steps.ctx.outputs.source_sha }}
      source_sha_short: ${{ steps.ctx.outputs.source_sha_short }}
      image_name: ${{ steps.ctx.outputs.image_name }}
      skip_build: ${{ steps.ctx.outputs.skip_build }}
      push_image: ${{ steps.ctx.outputs.push_image }}
    steps:
      - name: Resolve build context
        id: ctx
        shell: bash
        env:
          # For PRs, build the PR head commit; for pushes, the pushed commit.
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          SOURCE_SHA_SHORT="${SOURCE_SHA:0:12}"
          # Container registries require lowercase repository names.
          IMAGE_LOWER=$(echo "${REPOSITORY}" | tr '[:upper:]' '[:lower:]')

          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          echo "source_sha_short=${SOURCE_SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "image_name=${IMAGE_LOWER}" >> "$GITHUB_OUTPUT"

          # PRs build and scan only; images are published only from pushes to main.
          if [[ "$EVENT_NAME" != "push" ]]; then
            echo "push_image=false" >> "$GITHUB_OUTPUT"
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "push_image=true" >> "$GITHUB_OUTPUT"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            "https://ghcr.io/v2/${IMAGE_LOWER}/manifests/sha-${SOURCE_SHA_SHORT}")
          if [[ "$HTTP_STATUS" == "200" ]]; then
            echo "Image sha-${SOURCE_SHA_SHORT} already exists in GHCR, skipping rebuild."
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
          fi

  build-amd64:
    name: Build amd64
    needs: [prepare]
    if: needs.prepare.outputs.skip_build != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
      PUSH_IMAGE: ${{ needs.prepare.outputs.push_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          # Pull the BuildKit engine from Google's Docker Hub mirror, not Docker Hub.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          # Route Dockerfile base-image pulls (docker.io) through the same mirror.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GHCR
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || github.token }}

      - name: Build image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          # Push by digest on main; load into the local Docker daemon for PRs.
          outputs: >-
            ${{ env.PUSH_IMAGE == 'true'
                && format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.IMAGE_NAME)
                || format('type=docker,name={0}/{1}:pr-scan', env.REGISTRY, env.IMAGE_NAME) }}
          platforms: linux/amd64
          build-args: APP_VERSION=sha-${{ needs.prepare.outputs.source_sha_short }}
          cache-from: type=gha,scope=container-image-yml-amd64
          cache-to: type=gha,mode=max,scope=container-image-yml-amd64

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          image-ref: >-
            ${{ env.PUSH_IMAGE == 'true'
                && format('{0}/{1}@{2}', env.REGISTRY, env.IMAGE_NAME, steps.build.outputs.digest)
                || format('{0}/{1}:pr-scan', env.REGISTRY, env.IMAGE_NAME) }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  build-arm64:
    name: Build arm64
    needs: [prepare]
    if: needs.prepare.outputs.skip_build != 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
      PUSH_IMAGE: ${{ needs.prepare.outputs.push_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          # Pull the BuildKit engine from Google's Docker Hub mirror, not Docker Hub.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          # Route Dockerfile base-image pulls (docker.io) through the same mirror.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GHCR
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || github.token }}

      - name: Build image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          # Push by digest on main; load into the local Docker daemon for PRs.
          outputs: >-
            ${{ env.PUSH_IMAGE == 'true'
                && format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.IMAGE_NAME)
                || format('type=docker,name={0}/{1}:pr-scan', env.REGISTRY, env.IMAGE_NAME) }}
          platforms: linux/arm64
          build-args: APP_VERSION=sha-${{ needs.prepare.outputs.source_sha_short }}
          cache-from: type=gha,scope=container-image-yml-arm64
          cache-to: type=gha,mode=max,scope=container-image-yml-arm64

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: >-
            ${{ env.PUSH_IMAGE == 'true'
                && format('{0}/{1}@{2}', env.REGISTRY, env.IMAGE_NAME, steps.build.outputs.digest)
                || format('{0}/{1}:pr-scan', env.REGISTRY, env.IMAGE_NAME) }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  merge-manifest:
    name: Merge and Push Multi-Arch Manifest
    needs: [prepare, build-amd64, build-arm64]
    # Only publish tags for pushes to main, never for PRs.
    if: needs.prepare.outputs.skip_build != 'true' && needs.prepare.outputs.push_image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ needs.prepare.outputs.image_name }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          # Pull the BuildKit engine from Google's Docker Hub mirror, not Docker Hub.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || github.token }}

      - name: Create SHA and main manifests
        shell: bash
        env:
          SHA_SHORT: ${{ needs.prepare.outputs.source_sha_short }}
          AMD64_DIGEST: ${{ needs.build-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.build-arm64.outputs.digest }}
        run: |
          FULL_IMAGE="${REGISTRY}/${IMAGE_NAME}"
          docker buildx imagetools create \
            --tag "${FULL_IMAGE}:sha-${SHA_SHORT}" \
            --tag "${FULL_IMAGE}:main" \
            "${FULL_IMAGE}@${AMD64_DIGEST}" \
            "${FULL_IMAGE}@${ARM64_DIGEST}"

      - name: Inspect SHA manifest
        shell: bash
        env:
          SHA_SHORT: ${{ needs.prepare.outputs.source_sha_short }}
        run: docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:sha-${SHA_SHORT}"
